<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumia Android Installer</title>
<style>
:root {
  --accent: #0078d7;
  --bg: #171717;
  --nav: #202020;
  --card: #262626;
  --card-hi: #2f2f2f;
  --fg: #ffffff;
  --text: #e6e6e6;
  --sub: #a0a0a0;
  --dim: #666;
  --line: #353535;
  --dialog: #2b2b2b;
  --button: #3a3a3a;
  --ok: #6ccb5f;
  --warn: #fce100;
  --err: #ff99a4;
  --danger: #c42b1c;
  --mono: Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
body {
  font-family: "Segoe UI", "Selawik", "Open Sans", "Noto Sans", "Cantarell", "Helvetica Neue", Arial, sans-serif;
  font-size: 14px; line-height: 1.43; -webkit-font-smoothing: antialiased; overflow: hidden; user-select: none;
}
button { font: inherit; color: inherit; }
svg { display: block; }
.hidden { display: none !important; }

/* ---------------------------------------------------------------- shell */
#app { display: flex; height: 100%; min-width: 0; }

nav { width: 300px; flex: none; background: var(--nav); display: flex; flex-direction: column; border-right: 1px solid #0c0c0c; }
.brand { display: flex; align-items: center; gap: 12px; padding: 18px 20px 14px; }
.brand .logo { width: 28px; height: 28px; color: var(--accent); flex: none; }
.brand .name { font-size: 15px; font-weight: 600; color: var(--fg); line-height: 1.2; }
.brand .name small { display: block; font-size: 12px; font-weight: 400; color: var(--sub); }

.phonecard { margin: 4px 14px 14px; background: var(--accent); color: #fff; padding: 14px 16px; display: flex; gap: 14px;
  align-items: center; cursor: pointer; position: relative; transition: filter .1s; }
.phonecard:hover { filter: brightness(1.08); }
.phonecard:active { filter: brightness(.92); }
.phonecard.problem { background: var(--danger); }
.phonecard svg { width: 32px; height: 32px; flex: none; }
.phonecard .k { font-size: 12px; opacity: .85; }
.phonecard .v { font-size: 18px; line-height: 1.25; }
.phonecard .d { font-size: 12px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

.navlist { flex: 1; overflow-y: auto; padding: 4px 0; }
.navitem { display: flex; align-items: center; gap: 16px; height: 44px; padding: 0 20px; cursor: pointer; position: relative; color: var(--text); }
.navitem:hover { background: rgba(255,255,255,.06); }
.navitem:active { background: rgba(255,255,255,.03); }
.navitem svg { width: 18px; height: 18px; flex: none; }
.navitem.sel { font-weight: 600; color: var(--fg); }
.navitem.sel::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; background: var(--accent); }
.navitem .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-left: auto; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.navfoot { padding: 12px 20px 16px; font-size: 12px; color: var(--dim); }

main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.page { flex: 1; min-height: 0; overflow-y: auto; padding: 28px 40px 40px; scrollbar-width: thin; scrollbar-color: #4a4a4a transparent; }
.page.enter { animation: enter .28s cubic-bezier(.1,.9,.2,1); }
@keyframes enter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.wrap { max-width: 1120px; }
h1 { font-size: 28px; font-weight: 300; color: var(--fg); margin: 0 0 6px; letter-spacing: -.01em; }
h2 { font-size: 20px; font-weight: 400; color: var(--fg); margin: 0 0 12px; }
.lead { color: var(--sub); margin: 0 0 24px; max-width: 760px; }
.section { margin-top: 32px; }

/* ---------------------------------------------------------------- install page */
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.mode { background: var(--card); padding: 20px; display: flex; flex-direction: column; border: 1px solid transparent; position: relative; }
.mode:not(.locked):hover { border-color: #4a4a4a; }
.mhead { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
.mico { width: 44px; height: 44px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.mico svg { width: 24px; height: 24px; }
.mode.locked .mico { background: #3a3a3a; color: var(--dim); }
.mtitle { font-size: 20px; color: var(--fg); line-height: 1.2; }
.mtag { font-size: 12px; color: var(--ok); }
.mode.locked .mtag { color: var(--sub); }
.mode dl { margin: 0 0 18px; flex: 1; }
.mode dt { font-size: 12px; color: var(--sub); margin-top: 10px; }
.mode dd { margin: 2px 0 0; color: var(--text); }
.mode.locked dd { color: var(--sub); }
.lockmsg { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--sub); background: #1e1e1e; padding: 10px 12px; }
.lockmsg svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }

.cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; margin-top: 16px; }
.card { background: var(--card); padding: 20px; }
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { display: flex; gap: 14px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.steps li:first-child { border-top: 0; padding-top: 0; }
.snum { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--dim); display: grid; place-items: center; font-size: 12px;
  color: var(--sub); flex: none; }
.steps li.done .snum { background: var(--ok); border-color: var(--ok); color: #000; }
.steps li.next .snum { border-color: var(--accent); color: var(--fg); }
.steps li.future .snum { border-style: dashed; }
.stitle { color: var(--fg); }
.steps li.future .stitle { color: var(--sub); }
.ssub { font-size: 12px; color: var(--sub); }
.reqs { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
.reqs .k { color: var(--text); white-space: nowrap; }
.reqs .v { color: var(--sub); word-break: break-word; }
.reqs .v.bad { color: var(--warn); }
.reqs .v.good::before { content: "✓ "; color: var(--ok); }
.reqs .v.bad::before { content: "! "; }

/* ---------------------------------------------------------------- tools page */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 8px; }
.row { display: flex; gap: 16px; align-items: center; background: var(--card); padding: 14px 16px; cursor: pointer; border: 1px solid transparent;
  transition: background .08s; min-height: 72px; }
.row:hover { background: var(--card-hi); border-color: #444; }
.row:active { background: #242424; }
.row .ico { width: 24px; height: 24px; color: var(--accent); flex: none; }
.row .txt { min-width: 0; flex: 1; }
.row .title { color: var(--fg); font-size: 15px; }
.row .sub { font-size: 12px; color: var(--sub); }
.row .done { font-size: 12px; color: var(--ok); }
.row.busy { opacity: .5; cursor: default; }
.group { font-size: 14px; font-weight: 600; color: var(--fg); margin: 28px 0 10px; }
.group:first-of-type { margin-top: 8px; }

/* ---------------------------------------------------------------- buttons */
.btn { background: var(--button); border: 2px solid transparent; padding: 5px 20px; min-width: 120px; cursor: pointer; font-size: 14px; color: var(--fg); }
.btn:hover { border-color: #7a7a7a; }
.btn:active { background: #555; }
.btn.primary { background: var(--accent); }
.btn.primary:hover { border-color: rgba(255,255,255,.45); }
.btn.danger { background: var(--danger); }
.btn:disabled { opacity: .4; cursor: default; border-color: transparent; }
.mode .btn { align-self: flex-start; }

/* ---------------------------------------------------------------- task page */
#task { display: flex; flex-direction: column; overflow: hidden; }
.taskhead { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.taskhead h1 { flex: 1; margin: 0; }
.cmdbar { display: flex; gap: 2px; }
.cmd { background: none; border: 0; display: flex; align-items: center; gap: 8px; padding: 8px 14px; cursor: pointer; color: var(--text); }
.cmd:hover { background: rgba(255,255,255,.08); }
.cmd:active { background: rgba(255,255,255,.04); }
.cmd svg { width: 16px; height: 16px; }
.cmd.on { color: var(--accent); }
.progress { margin-top: 14px; display: none; }
.progress.on { display: block; }
.bar { height: 4px; background: #3a3a3a; overflow: hidden; }
.bar b { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.plabel { font-size: 12px; color: var(--sub); margin-top: 4px; display: flex; justify-content: space-between; gap: 8px; }
.dots { position: relative; height: 6px; overflow: hidden; margin-top: 14px; display: none; }
.dots.on { display: block; }
.dots i { position: absolute; top: 0; left: -8px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
  animation: dot 3.2s infinite cubic-bezier(.2,.6,.8,.4); }
.dots i:nth-child(2) { animation-delay: .18s; } .dots i:nth-child(3) { animation-delay: .36s; }
.dots i:nth-child(4) { animation-delay: .54s; } .dots i:nth-child(5) { animation-delay: .72s; }
@keyframes dot { 0% { left: -8px; opacity: 0; } 10% { opacity: 1; } 35% { left: 45%; } 65% { left: 55%; } 90% { opacity: 1; } 100% { left: 102%; opacity: 0; } }
.statusline { font-size: 13px; color: var(--sub); margin-top: 6px; min-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logpanel { flex: 1; min-height: 0; overflow-y: auto; background: #111; border: 1px solid var(--line); margin-top: 8px; padding: 12px 18px 18px;
  scrollbar-width: thin; scrollbar-color: #4a4a4a transparent; }
.log { font-size: 14px; }
.ln { padding: 2px 0 2px 22px; position: relative; white-space: pre-wrap; word-break: break-word; user-select: text; }
.ln::before { position: absolute; left: 0; top: 2px; width: 16px; text-align: center; font-weight: 700; }
.ln.step { padding-left: 0; margin-top: 16px; font-size: 18px; font-weight: 400; color: var(--fg); }
.ln.step:first-child { margin-top: 0; }
.ln.ok::before { content: "✓"; color: var(--ok); }
.ln.warn { color: #ffe98a; } .ln.warn::before { content: "!"; color: var(--warn); }
.ln.error { color: var(--err); } .ln.error::before { content: "×"; color: var(--err); }
.ln.info { color: var(--text); }
.ln.detail { color: #808080; font-family: var(--mono); font-size: 12px; display: none; }
.showdetail .ln.detail { display: block; }
.block { margin: 8px 0; background: var(--card); border-left: 3px solid var(--accent); padding: 8px 12px; }
.block h4 { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--sub); }
.block pre { margin: 0; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; user-select: text; color: var(--text); }

/* ---------------------------------------------------------------- settings */
.setsec { margin-bottom: 30px; max-width: 760px; }
.radio { display: flex; gap: 12px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.radio .dotr { width: 20px; height: 20px; border: 2px solid #ccc; border-radius: 50%; flex: none; margin-top: 1px; position: relative; }
.radio.on .dotr { border-color: var(--accent); }
.radio.on .dotr::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--fg); }
.radio:hover .dotr { border-color: #fff; }
.devpick { margin: 0 0 18px; }
.prep { margin: 0 0 18px; }
.prepstate { margin-top: 8px; font-weight: 600; opacity: .8; }
.prepstate.good { color: #6c6; opacity: 1; }
.devpick small { opacity: .7; }
.radio.busy { cursor: default; opacity: .6; }
.swatches { display: grid; grid-template-columns: repeat(7, 48px); gap: 4px; }
.swatch { width: 48px; height: 48px; cursor: pointer; border: 2px solid transparent; position: relative; }
.swatch:hover { border-color: rgba(255,255,255,.6); }
.swatch.on { border-color: #fff; }
.swatch.on::after { content: "✓"; position: absolute; right: 3px; bottom: 0; font-size: 13px; color: #fff; }
.about { color: var(--sub); font-size: 13px; line-height: 1.6; user-select: text; }
.about b { color: var(--text); font-weight: 600; }
.path { font-family: var(--mono); font-size: 12.5px; color: var(--text); user-select: text; word-break: break-all; }

/* ---------------------------------------------------------------- dialog */
.veil { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 10; padding: 24px; }
.dialog { width: 100%; max-width: 560px; max-height: calc(100vh - 48px); overflow-y: auto; background: var(--dialog); border: 1px solid #444;
  padding: 22px 24px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.6); animation: pop .2s cubic-bezier(.1,.9,.2,1); }
.dialog.wide { max-width: 680px; }
@keyframes pop { from { transform: scale(1.04); opacity: 0; } to { transform: none; opacity: 1; } }
.dialog h2 { font-size: 20px; margin: 0 0 10px; }
.dialog p { margin: 0 0 12px; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
.dialog .opt { display: flex; gap: 12px; padding: 10px 12px; margin: 0 -12px; cursor: pointer; }
.dialog .opt:hover { background: rgba(255,255,255,.06); }
.dialog .opt.disabled { cursor: default; opacity: .45; }
.dialog .opt.disabled:hover { background: none; }
.dialog .opt .title { color: var(--fg); }
.dialog .opt .sub { font-size: 12px; color: var(--sub); }
.badge { font-size: 11px; padding: 0 6px; border: 1px solid var(--sub); color: var(--sub); margin-left: 8px; vertical-align: 1px; }
.btns { display: flex; gap: 8px; margin-top: 22px; justify-content: flex-end; }
.btns .btn { flex: 0 1 50%; }
.field { margin: 14px 0; }
.field > label { display: block; color: var(--fg); }
.fsub { font-size: 12px; color: var(--sub); margin-top: 1px; }
input[type=text], input[type=number] { width: 100%; background: #1a1a1a; color: var(--fg); border: 2px solid #666; padding: 5px 8px;
  font: inherit; margin-top: 6px; outline: none; user-select: text; }
input[type=text]:hover, input[type=number]:hover { border-color: #888; }
input[type=text]:focus, input[type=number]:focus { border-color: var(--accent); background: #fff; color: #000; }
.toggle { display: inline-flex; align-items: center; gap: 12px; margin-top: 6px; cursor: pointer; }
.sw { width: 44px; height: 20px; border: 2px solid #ccc; border-radius: 10px; position: relative; flex: none; transition: background .12s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 4px; width: 10px; height: 10px; border-radius: 50%; background: #ccc; transition: left .12s; }
.toggle.on .sw { background: var(--accent); border-color: var(--accent); }
.toggle.on .sw::after { left: 26px; background: #fff; }
.toggle.disabled { opacity: .4; cursor: default; }

/* ---------------------------------------------------------------- narrow windows */
@media (max-width: 1100px) {
  .modes { grid-template-columns: 1fr; }
  .cols { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  nav { width: 52px; }
  .brand .name, .navitem span, .navfoot, .phonecard div { display: none; }
  .brand { padding: 18px 12px 14px; }
  .phonecard { margin: 4px 6px 12px; padding: 8px; justify-content: center; }
  .phonecard svg { width: 24px; height: 24px; }
  .navitem { padding: 0 17px; }
  .page { padding: 22px 20px 30px; }
}
</style>
</head>
<body>
<div id="app">
  <nav>
    <div class="brand"><span class="logo" data-icon="logo"></span>
      <div class="name"><span id="devname">Lumia</span> <small data-t="appsub">Android installer</small></div></div>
    <div class="phonecard" id="phonecard"></div>
    <div class="navlist">
      <div class="navitem" data-nav="install"><span data-icon="wizard"></span><span data-t="n_install">Install</span></div>
      <div class="navitem" data-nav="tools"><span data-icon="tools"></span><span data-t="n_tools">Advanced tools</span></div>
      <div class="navitem hidden" data-nav="task" id="navtask"><span data-icon="log"></span><span data-t="n_task">Activity</span></div>
      <div class="navitem" data-nav="settings"><span data-icon="gear"></span><span data-t="settings">Settings</span></div>
    </div>
    <div class="navfoot" id="navfoot"></div>
  </nav>

  <main>
    <section class="page" id="install"></section>
    <section class="page hidden" id="tools"></section>
    <section class="page hidden" id="task">
      <div class="taskhead"><h1 id="tasktitle"></h1>
        <div class="cmdbar">
          <button class="cmd" id="bDetail"><span data-icon="list"></span><span data-t="details">Details</span></button>
          <button class="cmd" id="bStop"><span data-icon="stop"></span><span data-t="stop">Stop</span></button>
          <button class="cmd hidden" id="bBack"><span data-icon="back"></span><span data-t="back">Back</span></button>
        </div></div>
      <div class="progress" id="prog"><div class="bar"><b id="pbar"></b></div><div class="plabel"><span id="plabel"></span><span id="ppct"></span></div></div>
      <div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="statusline" id="statusline"></div>
      <div class="logpanel" id="logscroll"><div class="log" id="log"></div></div>
    </section>
    <section class="page hidden" id="settings"></section>
  </main>

  <div class="veil hidden" id="veil"><div class="dialog" id="dialog"></div></div>
</div>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const ICONS = {
  logo: '<rect x="6.5" y="2.5" width="11" height="19" rx="1"/><path d="M9.5 9.5 12 7l2.5 2.5M12 7v7"/><path d="M10.5 18.5h3"/>',
  phone: '<rect x="6.5" y="2.5" width="11" height="19" rx="1.2"/><path d="M10.5 18.5h3"/>',
  wizard: '<path d="M4 20 15 9"/><path d="m14 6 1-3 1 3 3 1-3 1-1 3-1-3-3-1z"/><path d="M19 13l.6 1.4L21 15l-1.4.6L19 17l-.6-1.4L17 15l1.4-.6z"/>',
  backup: '<path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h7V4"/><rect x="7.5" y="13" width="9" height="7"/>',
  chip: '<rect x="7" y="7" width="10" height="10"/><path d="M9.5 7V3.5M14.5 7V3.5M9.5 20.5V17M14.5 20.5V17M7 9.5H3.5M7 14.5H3.5M20.5 9.5H17M20.5 14.5H17"/>',
  chain: '<path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1.2 1.2"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1.2-1.2"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16.5 9.5"/>',
  play: '<circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/>',
  flash: '<path d="M12 3v11"/><path d="m7.5 9.5 4.5 4.5 4.5-4.5"/><path d="M4 15v5h16v-5"/>',
  restore: '<path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/><path d="M12 8v4.5l3 2"/>',
  refresh: '<path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/>',
  erase: '<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/>',
  log: '<path d="M3 12h4l2.5-6 4 12 2.5-6h5"/>',
  tools: '<path d="M14.5 6.5a4 4 0 0 0 5 5L12 19a2.1 2.1 0 0 1-3-3l7.5-7.5"/><path d="M14.5 6.5 17 4l3 3-2.5 2.5"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4 5.3 5.3"/><circle cx="12" cy="12" r="6.5"/>',
  lock: '<rect x="5" y="10.5" width="14" height="10"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>',
  memory: '<path d="M4 7h16v10H4z"/><path d="M8 17v3M12 17v3M16 17v3M8 4v3M12 4v3M16 4v3"/>',
  stop: '<rect x="6" y="6" width="12" height="12"/>',
  list: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  back: '<path d="M19 12H5"/><path d="m11 6-6 6 6 6"/>',
  exit: '<path d="M14 4h6v16h-6"/><path d="M10 8l-4 4 4 4M6 12h10"/>',
  diag: '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>',
};
const svg = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ""}</svg>`;

const T = {
  en: {
    appsub: "Android installer", n_install: "Install", n_tools: "Advanced tools", n_task: "Activity", settings: "Settings",
    phone: "Phone", details: "Details", stop: "Stop", back: "Back",
    install_t: "Install Android", install_l: "Pick a mode. The installer goes through its steps in order, checks every write and resumes where it stopped.",
    before: "Phone before", does: "What happens", data: "Your data", available: "Available", later: "Not available",
    start: "Start", resume: "Continue", again: "Run again", busy: "A task is running",
    full: "Full install", full_before: "Windows 10 Mobile or 8.1, already unlocked and in mass storage mode (preparation)",

const ACCENTS = ["#0078d7", "#0063b1", "#8e8cd8", "#6b69d6", "#0099bc", "#00b7c3", "#00b294",
                 "#10893e", "#498205", "#ca5010", "#da3b01", "#e81123", "#c30052", "#881798"];
const MODES = [["full", "wizard"], ["clean", "erase"], ["update", "refresh"]];
const STEPS = ["backup", "firmware", "chain", "lk1st", "phase2", "rom"];
const TOOLS = [
  ["g_steps", [["backup", "backup"], ["firmware", "chip"], ["chain", "chain"], ["verify", "check"], ["phase2", "flash"]]],
  ["g_test", [["boot", "play"], ["ramoops", "memory"], ["flash", "flash"]]],
  ["g_maint", [["restore", "restore"], ["diag", "diag"], ["tools", "tools"]]],
];

let S = { lang: "en", phone: {}, done: {}, requirements: [], kit: [], modes: {}, device: "", devices: [] };
let lastEvent = 0, current = "install", taskName = null, polling = false, prompt = null, rendered = {};
const t = (k) => (T[S.lang] || T.en)[k] ?? T.en[k] ?? k;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = (s) => (s ? s.replace("T", " ").slice(0, 16) : "");

function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "X-Token": TOKEN, "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const sep = path.includes("?") ? "&" : "?";
  return fetch(path + (body === undefined ? sep + "t=" + encodeURIComponent(TOKEN) : ""), opt).then((r) => r.json());
}

function setAccent(a) { if (a) document.documentElement.style.setProperty("--accent", a); }

function paintIcons(root) { (root || document).querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = svg(el.dataset.icon))); }
function paintTexts() { document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t(el.dataset.t))); }

// ---------------------------------------------------------------- navigation
function go(page) {
  for (const p of ["install", "tools", "task", "settings"]) {
    const el = $(p);
    if (p === page) { el.classList.remove("hidden"); el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter"); }
    else el.classList.add("hidden");
  }
  current = page;
  document.querySelectorAll("[data-nav]").forEach((n) => n.classList.toggle("sel", n.dataset.nav === page));
  render(true);
}
document.querySelectorAll("[data-nav]").forEach((n) => (n.onclick = () => go(n.dataset.nav)));

function render(force) {
  renderNav();
  const fn = { install: renderInstall, tools: renderTools, settings: renderSettings }[current];
  if (!fn) return;
  const key = JSON.stringify([current, S.lang, S.done, S.running, S.requirements, S.kit, S.modes, S.admin, S.device, (S.phone || {}).mode]);
  if (!force && rendered[current] === key) return;
  rendered[current] = key;
  fn();
}

function renderNav() {
  const ph = S.phone || {};
  const pc = $("phonecard");
  pc.className = "phonecard" + (ph.problem ? " problem" : "");
  pc.title = t("diag");
  pc.innerHTML = `${svg("phone")}<div><div class="k">${t("phone")}</div><div class="v">${esc(ph.text || "…")}</div>
    <div class="d">${esc(ph.problem || ph.detail || (S.admin ? "" : t("admin_no")))}</div></div>`;
  const nt = $("navtask");
  nt.classList.toggle("hidden", !taskName);
  const pulse = nt.querySelector(".pulse");
  if (S.running && !pulse) nt.insertAdjacentHTML("beforeend", '<i class="pulse"></i>');
  if (!S.running && pulse) pulse.remove();
  const dev = (S.devices || []).find((d) => d.codename === S.device);
  $("devname").textContent = dev ? dev.name : "Lumia";
  document.title = (dev ? dev.name : "Lumia") + " Android Installer";
  $("navfoot").textContent = `lumia-installer ${S.version || ""} · ${S.platform || ""}`;
}
$("phonecard").onclick = () => startTask("diag");

// ---------------------------------------------------------------- install page
function renderInstall() {
  const doneCount = STEPS.filter((k) => S.done[k]).length;
  const next = STEPS.find((k) => !S.done[k]);
  let h = `<div class="wrap"><h1>${t("install_t")}</h1><p class="lead">${t("install_l")}</p>`;
  h += `<div class="setsec devpick"><h2>${t("device")}</h2>`;
  for (const d of S.devices || [])
    h += `<div class="radio ${S.device === d.codename ? "on" : ""} ${S.running ? "busy" : ""}" data-device="${esc(d.codename)}"><span class="dotr"></span>
      <div>${esc(d.name)} <small>(${esc(d.codename)}, ${esc(d.models.join(", "))})</small>${d.note ? `<div class="fsub">${esc(d.note)}</div>` : ""}</div></div>`;
  h += `<div class="fsub" style="margin-top:6px">${t("device_s")}</div></div>`;
  const mass = (S.phone || {}).mode === "mass";
  h += `<div class="setsec prep"><h2>${t("prep_t")}</h2><div class="fsub">${t("prep_l")}</div>
    <div class="prepstate ${mass ? "good" : ""}">${mass ? "✓ " + t("prep_ok") : t("prep_wait")}</div></div><div class="modes">`;
  for (const [key, icon] of MODES) {
    const ready = S.modes ? S.modes[key] !== false : true;
    const label = key === "full" ? (doneCount === 0 ? t("start") : doneCount < STEPS.length ? t("resume") : t("again")) : t("start");
    h += `<div class="mode ${ready ? "" : "locked"}">
      <div class="mhead"><span class="mico">${svg(ready ? icon : "lock")}</span>
        <div><div class="mtitle">${t(key)}</div><div class="mtag">${ready ? t("available") : t("later")}</div></div></div>
      <dl><dt>${t("before")}</dt><dd>${t(key + "_before")}</dd><dt>${t("does")}</dt><dd>${t(key + "_does")}</dd>
        <dt>${t("data")}</dt><dd>${t(key + "_data")}</dd></dl>
      ${ready ? `<button class="btn primary" data-run="${key}" ${S.running ? `disabled title="${t("busy")}"` : ""}>${label}</button>`
              : `<div class="lockmsg">${svg("lock")}<span>${t("locked_dev")}</span></div>`}</div>`;
  }
  h += `</div><div class="cols"><div class="card"><h2>${t("progress_t")}</h2><ol class="steps">`;
  STEPS.forEach((k, i) => {
    const d = S.done[k];
    const cls = d ? "done" : k === next ? "next" : "";
    h += `<li class="${cls}"><span class="snum">${d ? "✓" : i + 1}</span><div><div class="stitle">${t("s_" + k)}</div>
      <div class="ssub">${d ? `${t("done_on")} ${fmtDate(d)}` : (k === next ? t("next") + " · " : "") + t("s_" + k + "_s")}</div></div></li>`;
  });
  h += `</ol></div><div class="card"><h2>${t("req")}</h2><div class="reqs">`;
  for (const r of S.requirements) h += `<span class="k">${esc(r.name)}</span><span class="v ${r.ok ? "good" : "bad"}">${esc(r.hint || "OK")}</span>`;
  h += `</div><h2 style="margin-top:20px">${t("kit")}</h2><div class="reqs">`;
  for (const k of S.kit) h += `<span class="k">${esc(k.name)}</span><span class="v ${k.ok ? "good" : "bad"}">SHA-256</span>`;
  h += `</div></div></div></div>`;
  $("install").innerHTML = h;
  $("install").querySelectorAll("[data-run]").forEach((b) => (b.onclick = () => startTask(b.dataset.run)));
  $("install").querySelectorAll("[data-device]").forEach((el) => (el.onclick = () => {
    if (S.running || el.dataset.device === S.device) return;
    api("/api/device", { device: el.dataset.device }).then(refreshState).then(() => render(true));
  }));
}

// ---------------------------------------------------------------- tools page
function renderTools() {
  let h = `<div class="wrap"><h1>${t("tools_t")}</h1><p class="lead">${t("tools_l")}</p>`;
  for (const [group, items] of TOOLS) {
    h += `<div class="group">${t(group)}</div><div class="grid">`;
    for (const [key, icon] of items) {
      const stepKey = key === "verify" ? "lk1st" : key;
      const done = S.running === key ? `<div class="done" style="color:var(--accent)">…</div>`
        : S.done[stepKey] ? `<div class="done">${t("done_on")} ${fmtDate(S.done[stepKey])}</div>` : "";
      h += `<div class="row ${S.running ? "busy" : ""}" data-run="${key}"><span class="ico">${svg(icon)}</span>
        <div class="txt"><div class="title">${t(key)}</div><div class="sub">${t(key + "_s")}</div>${done}</div></div>`;
    }
    h += `</div>`;
  }
  $("tools").innerHTML = h + `</div>`;
  $("tools").querySelectorAll("[data-run]").forEach((b) => (b.onclick = () => { if (!S.running) startTask(b.dataset.run); }));
}

// ---------------------------------------------------------------- settings page
function renderSettings() {
  const cur = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  let h = `<div class="wrap"><h1>${t("settings")}</h1><p class="lead"></p>`;
  h += `<div class="setsec"><h2>${t("lang")}</h2>`;
  for (const [k, n] of [["en", "English"], ["it", "Italiano"]])
    h += `<div class="radio ${S.lang === k ? "on" : ""}" data-lang="${k}"><span class="dotr"></span><div>${n}</div></div>`;
  h += `</div><div class="setsec"><h2>${t("accent")}</h2><div class="swatches">` +
    ACCENTS.map((c) => `<div class="swatch ${c === cur ? "on" : ""}" data-accent="${c}" style="background:${c}"></div>`).join("") + `</div></div>`;
  h += `<div class="setsec"><h2>${t("work")}</h2><div class="path">${esc(S.work)}</div><div class="fsub" style="margin-top:6px">${t("work_s")}</div></div>`;
  h += `<div class="setsec"><h2>${t("about")}</h2><div class="about"><b>lumia-installer ${esc(S.version)}</b> · ${esc(S.platform)}<br>
    BootShim: imbushuo (boot-shim) · lk2nd/lk1st: msm8916-mainline, port KorelisLabs · WPinternals: René Lergner · TWRP: TeamWin ·
    Android4Lumia950: djokcho, EpicLPer, j0sh1x, sonic011gamer · Markynose (lumia930-linux) · Mainline4Lumia · LineageOS</div></div>`;
  h += `<div class="setsec"><button class="btn" data-quit>${t("quit")}</button><div class="fsub" style="margin-top:6px">${t("quit_s")}</div></div></div>`;
  $("settings").innerHTML = h;
  $("settings").querySelectorAll("[data-lang]").forEach((el) => (el.onclick = () => setLang(el.dataset.lang)));
  $("settings").querySelectorAll("[data-accent]").forEach((el) => (el.onclick = () => {
    setAccent(el.dataset.accent);
    api("/api/accent", { accent: el.dataset.accent });
    render(true);
  }));
  $("settings").querySelector("[data-quit]").onclick = () => api("/api/quit", {}).then((r) => {
    if (r.ok) document.body.innerHTML = `<div style="padding:48px;font-size:20px;font-weight:300">${t("bye")}</div>`;
  });
}

function setLang(lang) {
  return api("/api/lang", { lang }).then(refreshState).then(() => render(true));
}

function refreshState() {
  return api("/api/state").then((s) => {
    S = s; document.documentElement.lang = s.lang;
    setAccent(s.accent);
    paintTexts();
    if (current !== "task") render();
    else renderNav();
    if (s.running && taskName !== s.running) openTask(s.running, true);
    return s;
  }).catch(() => {});
}
setInterval(refreshState, 2000);

// ---------------------------------------------------------------- tasks
function startTask(name) {
  api("/api/run", { action: name }).then((r) => { if (r.ok) openTask(name, false); });
}

function openTask(name, rebuild) {
  taskName = name;
  $("tasktitle").textContent = t(name);
  $("log").innerHTML = ""; $("statusline").textContent = "";
  $("prog").classList.remove("on"); $("dots").classList.add("on");
  $("bStop").classList.remove("hidden"); $("bBack").classList.add("hidden");
  go("task");
  if (rebuild) lastEvent = 0; else lastEvent = Math.max(lastEvent, S.last_event || 0);
  if (!polling) pollEvents();
}

function addLine(kind, text) {
  const d = document.createElement("div");
  d.className = "ln " + kind; d.textContent = text;
  $("log").appendChild(d); scrollLog();
}
function scrollLog() { const s = $("logscroll"); s.scrollTop = s.scrollHeight; }

function handle(ev) {
  switch (ev.type) {
    case "log": addLine(ev.kind, ev.text); break;
    case "block": {
      const b = document.createElement("div"); b.className = "block";
      b.innerHTML = `<h4>${esc(ev.title)}</h4><pre>${esc(ev.lines.join("\n"))}</pre>`;
      $("log").appendChild(b); scrollLog(); break;
    }
    case "progress": {
      $("prog").classList.add("on"); $("statusline").textContent = "";
      if (ev.total) {
        const p = Math.min(100, (ev.done * 100) / ev.total);
        $("pbar").style.width = p + "%"; $("ppct").textContent = p.toFixed(0) + "%";
        if (ev.done >= ev.total) setTimeout(() => $("prog").classList.remove("on"), 600);
      } else { $("pbar").style.width = "100%"; $("ppct").textContent = ""; }
      $("plabel").textContent = ev.label; break;
    }
    case "status": $("statusline").textContent = ev.text; break;
    case "prompt": openPrompt(ev); break;
    case "prompt-closed": if (prompt && prompt.pid === ev.pid) closePrompt(); break;
    case "task":
      if (ev.state === "running") { if (taskName !== ev.name) openTask(ev.name, false); break; }
      $("dots").classList.remove("on"); $("statusline").textContent = "";
      $("bStop").classList.add("hidden"); $("bBack").classList.remove("hidden");
      addLine("step", { done: t("finished"), error: t("failed"), cancelled: t("cancelled") }[ev.state] || ev.state);
      closePrompt();
      refreshState();
      break;
  }
}

function pollEvents() {
  polling = true;
  api("/api/events?since=" + lastEvent).then((r) => {
    for (const ev of r.events) { lastEvent = Math.max(lastEvent, ev.id); handle(ev); }
    setTimeout(pollEvents, r.events.length ? 0 : 50);
  }).catch(() => setTimeout(pollEvents, 1500));
}

$("bStop").onclick = () => api("/api/cancel", {});
$("bDetail").onclick = () => { $("log").classList.toggle("showdetail"); $("bDetail").classList.toggle("on"); scrollLog(); };
$("bBack").onclick = () => refreshState().then(() => go(["full", "clean", "update", "wizard"].includes(taskName) ? "install" : "tools"));

// ---------------------------------------------------------------- dialogs
function openPrompt(p) {
  prompt = p;
  const d = $("dialog");
  d.className = "dialog" + (p.kind === "form" || p.kind === "choose" ? " wide" : "");
  let h = `<h2>${esc(p.title)}</h2>` + (p.body ? `<p>${esc(p.body)}</p>` : "");
  if (p.kind === "confirm") {
    if (p.word) h += `<div class="field"><label>${esc(t("type_word").replace("{w}", p.word))}</label><input type="text" id="pword" autocomplete="off" spellcheck="false"></div>`;
    h += `<div class="btns"><button class="btn ${p.danger ? "danger" : "primary"}" id="pyes" ${p.word ? "disabled" : ""}>${esc(p.yes)}</button>
      ${p.no !== null ? `<button class="btn" id="pno">${esc(p.no || t("cancel"))}</button>` : ""}</div>`;
  } else if (p.kind === "choose") {
    for (const o of p.options) {
      h += `<div class="opt ${o.disabled ? "disabled" : ""}" data-key="${o.disabled ? "" : o.key}"><div>
        <div class="title">${esc(o.title)}${o.badge ? `<span class="badge">${esc(o.badge)}</span>` : ""}</div>
        <div class="sub">${esc(o.sub || "")}</div></div></div>`;
    }
    h += `<div class="btns"><button class="btn" id="pno">${t("cancel")}</button></div>`;
  } else if (p.kind === "form") {
    for (const f of p.fields) {
      h += `<div class="field" data-field="${esc(f.key)}">`;
      if (f.type === "toggle") {
        h += `<label>${esc(f.label)}</label>${f.sub ? `<div class="fsub">${esc(f.sub)}</div>` : ""}
          <div class="toggle ${f.value ? "on" : ""} ${f.disabled ? "disabled" : ""}" data-toggle><span class="sw"></span><span class="tv">${f.value ? t("on") : t("off")}</span></div>`;
      } else if (f.type === "select") {
        h += `<label>${esc(f.label)}</label>`;
        for (const o of f.options) h += `<div class="radio ${o.key === f.value ? "on" : ""}" data-radio="${o.key}"><span class="dotr"></span><div><div>${esc(o.title)}</div><div class="fsub">${esc(o.sub || "")}</div></div></div>`;
      } else {
        h += `<label>${esc(f.label)}</label>${f.sub ? `<div class="fsub">${esc(f.sub)}</div>` : ""}
          <input type="${f.type === "number" ? "number" : "text"}" value="${esc(f.value)}" spellcheck="false" autocomplete="off">`;
      }
      h += `</div>`;
    }
    h += `<div class="btns"><button class="btn primary" id="pyes">${esc(p.submit)}</button><button class="btn" id="pno">${t("cancel")}</button></div>`;
  }
  d.innerHTML = h;
  $("veil").classList.remove("hidden");
  const w = $("pword");
  if (w) { w.focus(); w.oninput = () => ($("pyes").disabled = w.value !== p.word); }
  const yes = $("pyes"), no = $("pno");
  if (yes) yes.onclick = () => answer(p.kind === "form" ? collectForm(p) : true);
  if (no) no.onclick = () => answer(p.kind === "confirm" ? false : null);
  d.querySelectorAll("[data-key]").forEach((el) => (el.onclick = () => { if (el.dataset.key !== "") answer(Number(el.dataset.key)); }));
  d.querySelectorAll("[data-toggle]").forEach((el) => (el.onclick = () => {
    if (el.classList.contains("disabled")) return;
    el.classList.toggle("on"); el.querySelector(".tv").textContent = el.classList.contains("on") ? t("on") : t("off");
  }));
  d.querySelectorAll("[data-radio]").forEach((el) => (el.onclick = () => {
    el.parentElement.querySelectorAll("[data-radio]").forEach((x) => x.classList.remove("on")); el.classList.add("on");
  }));
}

function collectForm(p) {
  const out = {};
  for (const f of p.fields) {
    const el = document.querySelector(`[data-field="${CSS.escape(f.key)}"]`);
    if (f.type === "toggle") out[f.key] = el.querySelector("[data-toggle]").classList.contains("on");
    else if (f.type === "select") { const on = el.querySelector(".radio.on"); out[f.key] = on ? Number(on.dataset.radio) : f.value; }
    else if (f.type === "number") out[f.key] = Number(el.querySelector("input").value || 0);
    else out[f.key] = el.querySelector("input").value;
  }
  return out;
}

function answer(value) { if (!prompt) return; api("/api/answer", { pid: prompt.pid, value }); closePrompt(); }
function closePrompt() { prompt = null; $("veil").classList.add("hidden"); $("dialog").innerHTML = ""; }
document.addEventListener("keydown", (e) => {
  if (!prompt) return;
  if (e.key === "Escape" && $("pno")) $("pno").click();
  if (e.key === "Enter" && $("pyes") && !$("pyes").disabled) $("pyes").click();
});

// ---------------------------------------------------------------- start
paintIcons();
go("install");
refreshState().then((s) => { if (s && s.running) openTask(s.running, true); });
</script>
</body>
</html>
